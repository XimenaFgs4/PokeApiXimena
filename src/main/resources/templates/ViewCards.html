<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://wwww.ultraq.net.nz/thymeleaf/layout"
      layout:decorate = ~{layout}>
    <head>
        <style>

            * {
                font-family: Calibri
            }

            .cardPoke{
                box-sizing:border-box;
                display: flex;
                flex-direction:column;
                position:relative;
                justify-content: center;
                text-align: center;
                width:250px;
                height:370px;
                background:linear-gradient(-55deg, #000957 0%, #000000 100%);
                color: #81818144;
                /*                                padding:14px;*/
                /*                gap:10px;*/
                /*                border-style:none;*/
                /*                background-color: #000957;*/
                border-radius: 10px;
                margin-bottom: 30px;
                margin-left: 30px;
                border:solid 7px #212121;
            }

            .card-title{
                /*                padding-bottom:30px;*/
                margin:10px;
                color:white;
                text-transform: uppercase;
                font-size: x-large;
                text-align:center;
                text-shadow: 6px 6px 6px yellow;

            }


            .card-text{
                text-align:center;
                margin:10px;
                color:white;

            }

            .cardPoke:hover {
                transform: scale(1.1, 1.1);
                transition: all 0.3s ease;
            }

            .cardPoke:hover > .card:not(:hover) {
                filter: blur(10px);
                transform: scale(0.9, 0.9);
            }

            .imagen{
                box-sizing: border-box;
                padding-bottom:40px;
            }

            .radio-inputs {
                position: relative;
                display: flex;
                flex-wrap: wrap;
                border-radius: 0.5rem;
                background-color:#EEE;
                box-sizing: border-box;
                box-shadow: 0 0 0px 1px rgba(0, 0, 0, 0.06);
                color:black;
                padding: 0.25rem;
                width: 100px;
                font-size: 16px;
                /*                padding-bottom:5px;*/
                /*                justify-content:center;*/

            }

            .radio-inputs .radio1 {
                flex: 1 1 auto;
                text-align: center;
            }

            .inputss{
                justify-content:center;
                margin:auto;
            }

            .boton2 {
                
                height:40px;
                background-color:#FEBA17;
                border-radius: 10px;
                border:none;
                padding-left: 30px;
                padding-right: 30px;
                margin-right: 20px;
                position: fixed;
                transform: translate(0%, 10px);
                z-index: 1;
            }

            .boton4{
                width:5px;
                height:40px;
                background-color:#FEBA17;
                border-radius: 10px;
                border:none;
                padding-left: 30px;
                padding-right: 30px;
                margin-right: 20px;
                position: fixed;
                transform: translate(0%, 50px);
                z-index: 1;

            }

            /*            .radio-inputs .radio1 input {
                            display: none;
                        }*/

            /*            .radio-inputs .radio1 .name {
                            display: flex;
                            cursor:progress;
                            align-items: center;
                            justify-content: center;
                            border-radius: 0.5rem;
                            border: none;
                            padding: .5rem 0;
                            color: rgba(51, 65, 85, 1);
                            transition: all .15s ease-in-out;
                        }
            
                        .radio-inputs .radio1 input:checked + .name {
                            background-color: #fff;
                            font-weight: 600;
                        }*/

            /*            .inputss {
                             display:flex; 
                             justify-content:center;
                        }*/

            /*            .radio {
                            color:#000000;
                        }*/



        </style>




    </head>
    <body layout:fragment = "body" style="background-color:white">
        <button class="boton2" type="submit" style="margin-right: 10px; position: absolute">
            <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="currentColor" class="bi bi-caret-left" viewBox="0 0 16 16">
            <path d="M10 12.796V3.204L4.519 8zm-.659.753-5.48-4.796a1 1 0 0 1 0-1.506l5.48-4.796A1 1 0 0 1 11 3.204v9.592a1 1 0 0 1-1.659.753"/>
            </svg>
        </button>
        <button class="boton4" type="submit" style="margin-right: 10px; position: absolute"> 
            <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" fill="currentColor" class="bi bi-caret-right" viewBox="0 0 16 16">
            <path d="M6 12.796V3.204L11.481 8zm.659.753 5.48-4.796a1 1 0 0 0 0-1.506L6.66 2.451C6.011 1.885 5 2.345 5 3.204v9.592a1 1 0 0 0 1.659.753"/>
            </svg>
        </button>


        <div class="row justify-content-center">
            <!--            <img th:src="@{Imagenes/Pokebola.png}" alt="img" width="80" height="80">-->

            <div class="cardPoke" th:each="pokemonURL: ${listaPokemones}" style="cursor:pointer">
                <a th:href="@{/PokeApi/PokemonName/{name}(name = ${pokemonURL.name})}" class="stretched-link"></a>
                <div class="card-body1">
                    <img class="img-i" th:src="${pokemonURL.sprites.other.dream_world.front_default}" alt="imgPokemon" style="max-width:100%;height:200px;">
                    <div class ="titulo">
                        <h5 class="card-title" th:text="${pokemonURL.name}"></h5>

                    </div>

                    <!--                    <p class="card-text" th:text="${pokemonURL.id}"></p>-->
                    <!--                    <p class="tipo" th:text="${pokemonURL.types.type.name}"></p>-->

                    <!--                    <div class="radio-inputs" th:each="typePokemon: ${pokemonURL.types}" >
                                            <label class="radio" th:text="${typePokemon.type.name}">
                                                <input type="radio" name="radio" checked="">
                                                <span class="name"></span>
                                            </label>
                                        </div>-->

                    <div class="inputss col-12 row">
                        <div class="radio-inputs" th:each="typePokemon: ${pokemonURL.types}">
                            <label class="radio1" th:text="${typePokemon.type.name}">
                                <input type="radio1" name="radio" checked="">
                                <span class="name" th:text="${typePokemon.type.name}"></span>
                            </label>

                        </div>
                    </div>
                </div>
            </div>




        </div>
    </body>
</html>
