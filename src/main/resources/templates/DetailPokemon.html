<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://wwww.ultraq.net.nz/thymeleaf/layout"
      layout:decorate = ~{layout}>
    <head>
        <style>
            *{
                font-family: Calibri

            }

            .card{
                position:relative;

                margin:auto;
                box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px,
                    rgba(0, 0, 0, 0.3) 0px 30px 60px -30px;
                margin: auto;
                margin-top: 50px;
                border-radius: 15px;
                height: 500px;
                position:relative;

            }

            .img-i{
                margin:auto;
                top:50%;
                left:50%;
                transform: translate(45%, -50%);
                height: 250px;
                width:250px;

            }


            .card-title{
                margin-top: -50px;
                text-transform: uppercase;
                text-align: center;
                color:white;

            }

            .card-body{
                background:linear-gradient(-55deg, #000957 0%, #000000 100%);
                border-radius: 15px;
                width: 480px;
                height:400px;
                margin-top:60px;
                margin-left: 28px;
            }

            .radio-inputs {
                position: relative;
                display: flex;
                flex-wrap: wrap;
                border-radius: 0.5rem;
                background-color:#EEE;
                box-sizing: border-box;
                box-shadow: 0 0 0px 1px rgba(0, 0, 0, 0.06);
                color:black;
                padding: 0.25rem;
                width: 100px;
                font-size: 16px;
                /*                justify-content:center;*/

            }

            .radio-inputs .radio1 {
                flex: 1 1 auto;
                text-align: center;
            }

            .inputss{
                justify-content:center;
                margin:auto;
            }








            /*
                        .pokeBola{
                            position:absolute;
                            z-index: 1;
            
                            bottom: 60px;
                            right: -45px;
                            height: 90px;
                            width:90px;
                        }
            */


        </style>

    </head>
    <body layout:fragment = "body">

        <!--        <p class ="pokeId" th:text="${namePokemon.id}">  </p>-->
        <div class="card mb-3" style="max-width: 540px;">

            <div class="row g-0">
                <div class="col-md-4">

                    <div class="card-body">
                        <img class="img-i" th:src="${namePokemon.sprites.other.dream_world.front_default}" alt="imgPokemon" style="max-width:100%;height:200px;">


                            <!--                        <img class="pokeBola" th:src="@{/Imagenes/Pokebola.png}" alt="img">-->
                            <h5 class="card-title" th:text="${namePokemon.name}"></h5>
                        
                            <div class="cardPoke" th:each="pokemonURL: ${namePokemon}" style="cursor:pointer">

                            <div class="inputss col-12 row">
                                <div class="radio-inputs" th:each="typePokemon: ${namePokemon.types}">
                                    <label class="radio1" th:text="${typePokemon.type.name}">
                                        <input type="radio1" name="radio" checked="">
                                        <span class="name" th:text="${typePokemon.type.name}"></span>
                                    </label>

                                </div>
                            </div>




                        </div>
                    </div>
                </div>
            </div>
        </div>





    </body>
</html>
