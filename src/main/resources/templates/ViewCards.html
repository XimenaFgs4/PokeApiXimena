<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://wwww.ultraq.net.nz/thymeleaf/layout"
      layout:decorate = ~{layout}>
    <head>
        <style>

            * {
                font-family: Calibri
            }



            .cardPoke{
                display: flex;
                flex-direction:column;
                position:relative;
                justify-content: center;
                width:250px;
                height:370px;
                background:linear-gradient(-55deg, #000957 0%, #000000 100%);
                color: #81818144;
                padding:14px;
                gap:10px;
                /*                border-style:none;*/
                /*                background-color: #000957;*/
                border-radius: 10px;
                margin-left: 40px;
                margin-bottom: 40px;
            }

            .card-title{
                margin:10px;
                color:white;
                text-transform: uppercase;
                font-size: x-large;
                text-align:center;
                text-shadow: 6px 6px 6px yellow;

            }


            .card-text{
                text-align:center;
                margin:10px;
                color:white;

            }

            .cardPoke:hover {
                transform: scale(1.1, 1.1);
                transition: all 0.3s ease;
            }

            .cardPoke:hover > .card:not(:hover) {
                filter: blur(10px);
                transform: scale(0.9, 0.9);
            }

            .tipo{
                color:white;
            }

            .Hability{
                color:white;

            }






        </style>




    </head>
    <body layout:fragment = "body" style="background-color:white">

        <div class="row justify-content-center">
            <!--            <img th:src="@{Imagenes/Pokebola.png}" alt="img" width="80" height="80">-->

            <div class="cardPoke" th:each="pokemonURL: ${listaPokemones}" style="cursor:pointer">
                <a th:href="@{/PokeApi/PokemonName/{name}(name = ${pokemonURL.name})}" class="stretched-link"></a>
                <div class="card-body1">
                    <img class="img-i" th:src="${pokemonURL.sprites.other.dream_world.front_default}" alt="imgPokemon" style="max-width:100%;height:200px;">
                    <h5 class="card-title" th:text="${pokemonURL.name}"></h5>

                    <p class="card-text" th:text="${pokemonURL.id}"></p>
                    <p class="tipo">Tipo:<div class = "tipo" th:text="${pokemonURL.types}"></div></p>
                    <p class="Hability">Habilidad: </p>
                </div>
            </div>



        </div>
    </body>
</html>
